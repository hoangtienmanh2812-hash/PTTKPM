<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Trang chủ - Thư viện số</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="home.css">
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="header">
  <div class="logo">
    <strong>📚 Thư viện số</strong>
  </div>

  <nav class="nav">
    <a href="home.html">Trang chủ</a>
    <a href="#">Sách điện tử</a>
    <a href="dashboard.html">Sách giấy</a>
    <a href="#">Kho chứng</a>
    <a href="#">Tin tức</a>
  </nav>

  <div class="user" id="userSection">
    <span id="userName">👤 Mạnh</span>
  </div>
</header>

<!-- ===== HERO ===== -->
<section class="hero">
  <h1>Chào mừng bạn đến với</h1>
  <h2>Thư viện trực tuyến của nhóm 11</h2>

  <div class="search-box">
    <input type="text" placeholder="Nhập tên sách..." id="searchInput">
    <button onclick="window.location.href='dashboard.html'">Tìm kiếm nâng cao</button>
  </div>
</section>

<!-- ===== MAIN CONTENT ===== -->
<section class="main">
  
  <!-- Banner -->
  <div class="banner">
    <img src="../img/home.png" alt="Thư viện">
  </div>

  <!-- Featured Books -->
  <div class="featured-section">
    <h3>Những ấn phẩm nổi bật</h3>
    
    <div class="featured-grid" id="featuredGrid">
      <!-- Books will be loaded here -->
    </div>
  </div>

</section>

<footer>
    <p style="text-align: center; color: #c1c1c1; padding: 20px;">© 2024 Thư viện số - Nhóm 11</p>
</footer>

<script src="login.js"></script>
<script src="app.js"></script>
<script>
  // Load featured books on home page
  window.addEventListener('load', function() {
    updateUserUI();
    loadFeaturedBooks();
  });
  
  function updateUserUI() {
    const userSection = document.getElementById('userSection');
    const currentUser = localStorage.getItem('currentUser');
    
    if (currentUser) {
      // User is logged in
      userSection.innerHTML = `
        <div class="user-menu">
          <span id="userDisplay">👤 ${currentUser}</span>
          <div class="dropdown-menu" id="dropdownMenu">
            <a href="#" onclick="logout(event)">Đăng xuất</a>
          </div>
        </div>
      `;
      
      // Add click event to toggle dropdown
      document.getElementById('userDisplay').addEventListener('click', function(e) {
        e.stopPropagation();
        const menu = document.getElementById('dropdownMenu');
        menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
      });
    } else {
      // User is not logged in
      userSection.innerHTML = `
        <div class="auth-buttons">
          <button class="btn-signup" onclick="window.location.href='login.html'">Đăng ký</button>
          <button class="btn-login" onclick="window.location.href='login.html'">Đăng nhập</button>
        </div>
      `;
    }
  }
  
  // Close dropdown when clicking outside
  document.addEventListener('click', function() {
    const dropdownMenu = document.getElementById('dropdownMenu');
    if (dropdownMenu) {
      dropdownMenu.style.display = 'none';
    }
  });
  
  function logout(event) {
    event.preventDefault();
    localStorage.removeItem('currentUser');
    localStorage.removeItem('userRole');
    window.location.href = 'home.html';
  }
  
  function loadFeaturedBooks() {
    const grid = document.getElementById('featuredGrid');
    grid.innerHTML = '';
    
    books.slice(0, 4).forEach(book => {
      const div = document.createElement('div');
      div.className = 'featured-book-card';
      div.innerHTML = `
        <div class="book-image">
          <img src="${book.image}">
        </div>
        <h4>${book.title}</h4>
        <p class="author">${book.author}</p>
      `;
      div.onclick = () => {
        window.location.href = 'dashboard.html';
      };
      grid.appendChild(div);
    });
  }
</script>
</body>
</html>
