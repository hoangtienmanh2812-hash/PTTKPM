<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập - Thư viện sách</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-wrapper">

  <div class="login-left">
    <h1>Chào mừng đến với Thư viện sách</h1>
    <p>Khám phá hàng ngàn cuốn sách và tài liệu học tập</p>
  </div>

  <div class="login-right">
    <div class="login-box">
      <div style="text-align: center; margin-bottom: 30px;">
        <div style="font-size: 48px; margin-bottom: 10px;">📚</div>
        <h2>Đăng nhập</h2>
      </div>
      <p>Vui lòng đăng nhập vào tài khoản của bạn</p>

      <div id="error" style="color: #d32f2f; font-size: 14px; margin-bottom: 15px; text-align: center; min-height: 20px;"></div>

      <input id="email" type="email" placeholder="Địa chỉ email">
      <input id="password" type="password" placeholder="Nhập mật khẩu">

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox">
          Ghi nhớ tôi
        </label>
        <a href="#" class="forgot-password">Quên mật khẩu?</a>
      </div>

      <button onclick="login()">ĐĂNG NHẬP</button>

      <div class="signup-link">
        Bạn chưa có tài khoản? <a href="#">Tạo tài khoản</a>
      </div>
    </div>
  </div>

</div>

<script src="login.js"></script>
</body>
</html>
